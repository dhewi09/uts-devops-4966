apiVersion: apps/v1
kind: Deployment
metadata:
  name: uts-devops-deployment
  labels:
    app: uts-devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uts-devops
  template:
    metadata:
      labels:
        app: uts-devops
    spec:
      containers:
        - name: uts-devops-container
          image: dhewi09/uts-devops-4966:latest # Ganti dengan nama image di Docker Hub jika sudah di-push
          ports:
            - containerPort: 5000
